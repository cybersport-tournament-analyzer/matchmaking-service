name: Matchmaking Service Docker CI

on:
  push:
    branches:
      - cicd
  pull_request:
    branches:
      - cicd

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub (optional)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        with:
          matchmakingname: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t vkr-matchmaking-service:latest .

      - name: Save Docker image as tar
        run: |
          docker save -o vkr-matchmaking-service.tar vkr-matchmaking-service:latest

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vkr-matchmaking-service
          path: vkr-matchmaking-service.tar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: .

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          CONFIG_HOST: ${{ secrets.CONFIG_HOST }}
          EUREKA_HOST: ${{ secrets.EUREKA_HOST }}
          CONFIG_GITHUB_LABEL: ${{ secrets.CONFIG_GITHUB_LABEL }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts

          # Copy Docker image to server
          scp ./vkr-matchmaking-service/vkr-matchmaking-service.tar $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH

          # Load Docker image and run container
          ssh $REMOTE_USER@$REMOTE_HOST << EOF
            set -x
            cd $REMOTE_PATH
            ls -la
            docker load -i vkr-matchmaking-service.tar
            docker stop vkr-matchmaking-service || true
            docker rm vkr-matchmaking-service || true
            docker run --name vkr-matchmaking-service -d -p 8081:8081 -e CONFIG_HOST=$CONFIG_HOST -e CONFIG_GITHUB_LABEL=$CONFIG_GITHUB_LABEL -e EUREKA_HOST=$EUREKA_HOST vkr-matchmaking-service:latest
            exit
          EOF