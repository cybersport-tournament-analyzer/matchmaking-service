version: "3"
services:

  eureka-service:
    container_name: eureka-server
    image: eureka-service
    ports:
      - "8761:8761"

  config-service:
    container_name: config-server
    image: config-server
    environment:
      GITHUB_USER: #username
      GITHUB_TOKEN: #token
      GITHUB_URL: https://github.com/cybersport-tournament-analyzer/config.git
    ports:
      - "8888:8888"

  postgresql:
    container_name: postgresql
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    restart: unless-stopped

  minio:
    image: minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ~/minio/data:/data
    environment:
      - MINIO_ROOT_USER=user
      - MINIO_ROOT_PASSWORD=password
    command: server --console-address :9001 /data

  master_redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"

networks:
  postgres:
    driver: bridge
  minio:
    driver: bridge
  redis:
    driver: bridge

volumes:
  postgres:
  minio_data: